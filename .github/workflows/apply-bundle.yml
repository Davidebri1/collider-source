# Apply a verified git bundle onto main.
#
# Modes (request JSON):
#   - default / fast-forward: tip must be a descendant of origin/main; push FF.
#     FAILS if the tip adds/changes .github/workflows (GITHUB_TOKEN cannot push those).
#   - rebase_onto_main: true — take non-workflow tree from tip, commit onto current
#     main. Fails if any .github/workflows file on the tip differs from origin/main
#     (upload workflows via the GitHub web UI first so they match).
#
# Push request JSON on a SIDE BRANCH, not main.
name: Apply source bundle

on:
  push:
    paths: ['deploy/source-requests/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collider-source-apply-bundle
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Ensure origin/main is present
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          echo "origin/main=$(git rev-parse origin/main)"

      - name: Select request JSON
        id: req
        run: |
          set -euo pipefail
          mapfile -t files < <(find deploy/source-requests -type f -name '*.json' ! -name '.*' | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No request JSON; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ${#files[@]} -gt 1 ]]; then
            echo "Multiple pending requests; apply exactly one at a time:" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          REQ="${files[0]}"
          echo "Using $REQ"
          echo "file=$REQ" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          python3 - "$REQ" <<'PY'
          import json, sys, os
          d = json.load(open(sys.argv[1]))
          for k in ("bundle_url", "sha256", "size", "tip"):
              if k not in d:
                  raise SystemExit(f"request missing {k}")
          rebase = bool(d.get("rebase_onto_main") or d.get("rebaseOntoMain"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"bundle_url={d['bundle_url']}\n")
              o.write(f"sha256={d['sha256']}\n")
              o.write(f"size={d['size']}\n")
              o.write(f"tip={d['tip']}\n")
              o.write(f"tag={d.get('tag', 'v9.2.0-smartgen')}\n")
              o.write(f"rebase={'true' if rebase else 'false'}\n")
          PY

      - name: Download and verify bundle
        if: steps.req.outputs.skip != 'true'
        env:
          BUNDLE_URL: ${{ steps.req.outputs.bundle_url }}
          EXPECT_SHA: ${{ steps.req.outputs.sha256 }}
          EXPECT_SIZE: ${{ steps.req.outputs.size }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/source.bundle "$BUNDLE_URL"
          SIZE=$(wc -c < /tmp/source.bundle | tr -d ' ')
          SHA=$(sha256sum /tmp/source.bundle | awk '{print $1}')
          echo "downloaded size=$SIZE sha256=$SHA"
          [[ "$SIZE" == "$EXPECT_SIZE" ]] || { echo "size mismatch" >&2; exit 1; }
          [[ "$SHA" == "$EXPECT_SHA" ]] || { echo "sha256 mismatch" >&2; exit 1; }
          git bundle verify /tmp/source.bundle

      - name: Fetch tip from bundle
        if: steps.req.outputs.skip != 'true'
        env:
          EXPECT_TIP: ${{ steps.req.outputs.tip }}
        run: |
          set -euo pipefail
          git fetch /tmp/source.bundle HEAD:refs/heads/incoming-bundle
          GOT=$(git rev-parse incoming-bundle)
          echo "got tip $GOT"
          [[ "$GOT" == "$EXPECT_TIP" ]] || { echo "tip mismatch" >&2; exit 1; }

      - name: Apply (fast-forward)
        if: steps.req.outputs.skip != 'true' && steps.req.outputs.rebase != 'true'
        env:
          TIP: ${{ steps.req.outputs.tip }}
          TAG: ${{ steps.req.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor origin/main incoming-bundle; then
            echo "NOT a fast-forward. Use rebase_onto_main: true in the request JSON." >&2
            exit 1
          fi
          # Refuse tips that change workflows — GITHUB_TOKEN cannot push those.
          if ! git diff --quiet origin/main incoming-bundle -- .github/workflows; then
            echo "Tip changes .github/workflows; GITHUB_TOKEN cannot push that." >&2
            echo "Upload workflow files via the web UI first, then use rebase_onto_main." >&2
            git diff --stat origin/main incoming-bundle -- .github/workflows >&2
            exit 1
          fi
          git push origin "refs/heads/incoming-bundle:refs/heads/main"
          git tag -f "$TAG" "$TIP"
          git push -f origin "refs/tags/$TAG"
          echo "main and tag $TAG now at $TIP"

      - name: Apply (rebase_onto_main — non-workflow tree only)
        if: steps.req.outputs.skip != 'true' && steps.req.outputs.rebase == 'true'
        env:
          TIP: ${{ steps.req.outputs.tip }}
          TAG: ${{ steps.req.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Workflows on tip MUST already match origin/main (uploaded via web UI).
          if ! git diff --quiet origin/main incoming-bundle -- .github/workflows; then
            echo "FATAL: .github/workflows on tip differs from origin/main." >&2
            echo "Upload the exact workflow files from the tip via the GitHub web UI first." >&2
            git diff --stat origin/main incoming-bundle -- .github/workflows >&2
            exit 1
          fi

          git checkout -B apply-rebase origin/main
          # Bring entire tip tree, then restore workflows from main (identical, but explicit).
          git restore --source=incoming-bundle --staged --worktree .
          git restore --source=origin/main --staged --worktree .github/workflows
          # Drop request files from the landing commit if present
          git rm -rf --ignore-unmatch deploy/source-requests || true

          if git diff --cached --quiet; then
            echo "No non-workflow changes to apply; main already matches tip outside workflows."
            NEW=$(git rev-parse HEAD)
          else
            git commit -m "apply bundle ${TIP:0:12}: non-workflow tree onto main (rebase_onto_main)"
            NEW=$(git rev-parse HEAD)
          fi

          git push origin "HEAD:refs/heads/main"
          git tag -f "$TAG" "$NEW"
          git push -f origin "refs/tags/$TAG"
          echo "main and tag $TAG now at $NEW (workflows unchanged from pre-apply main)"

      - name: Remove request file on triggering branch
        if: steps.req.outputs.skip != 'true'
        env:
          REQ_FILE: ${{ steps.req.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${{ github.ref }}"
          git checkout -B apply-cleanup "${{ github.ref }}"
          if [[ -f "$REQ_FILE" ]]; then
            git rm -f "$REQ_FILE"
            git commit -m "chore: consume source-request $(basename "$REQ_FILE")" || true
            git push origin "HEAD:${{ github.ref }}" || true
          fi
